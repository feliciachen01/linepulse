<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinePulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f5;        /* flour */
    --surface: #ffffff;
    --ink: #1e2a2f;       /* oven steel */
    --ink-2: #536269;
    --ink-3: #7d8a90;
    --rule: #e2e6e3;
    --accent: #0e6e6b;    /* line teal: interactive + the handover */
    --accent-soft: #e3f1f0;
    --ok: #2f7d4e;
    --warn: #9a5b00;
    --bad: #b42318;
    --bad-soft: #fbe9e7;
    --series: #2a78d6;
    --band: rgba(42,120,214,.08);
    --grid: #eceeec;
    --font: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121719; --surface: #1a2124; --ink: #e8ecea; --ink-2: #a9b4b9; --ink-3: #7f8b91;
      --rule: #2a3336; --accent: #55b8b2; --accent-soft: #173533; --ok: #5cc28a; --warn: #f0b04a;
      --bad: #f07a6c; --bad-soft: #3a1f1c; --series: #3987e5; --band: rgba(57,135,229,.14); --grid: #222b2e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 600px) { .wrap { padding: 0 16px; } }

  .top { border-bottom: 1px solid var(--rule); background: var(--surface); }
  .top .wrap { display: flex; align-items: baseline; gap: 16px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
  .brand { font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
  .top .meta { color: var(--ink-2); font-size: 14px; }
  .top .mode { margin-left: auto; font-size: 13px; color: var(--ink-2); }

  .snapshot { color: var(--ink-2); font-size: 14px; padding-top: 14px; }
  .hero { padding: 28px 0 8px; }
  .hero h1 { font-size: 34px; line-height: 1.15; font-weight: 600; margin: 0 0 6px; letter-spacing: -.015em; max-width: 26ch; }
  .hero h1.attn { color: var(--bad); }
  .hero p { margin: 0; color: var(--ink-2); max-width: 70ch; }

  section { margin-top: 32px; }
  h2 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
  .note-s { color: var(--ink-3); font-size: 14px; margin: 8px 0 0; }

  /* The handover: the one bold element */
  .handover { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 6px; padding: 20px 24px; }
  .handover-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .handover-head h2 { margin: 0; }
  .tabs { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .tabs button { font: inherit; font-size: 14px; background: none; border: 0; padding: 4px 12px; color: var(--ink-2); cursor: pointer; }
  .tabs button + button { border-left: 1px solid var(--rule); }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
  .checked { margin-left: auto; font-size: 14px; color: var(--ok); }
  .checked.bad { color: var(--bad); }
  .note { font-size: 17px; line-height: 1.6; max-width: 72ch; }
  .note p { margin: 0 0 10px; }
  .note ul { margin: 0 0 12px; padding-left: 20px; }
  .note li { margin: 2px 0; }
  .fig { text-decoration: underline dotted; text-decoration-color: var(--ok); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
  .fig.bad { text-decoration: underline solid; text-decoration-color: var(--bad); background: var(--bad-soft); }
  .handover details { margin-top: 10px; font-size: 14px; color: var(--ink-2); }
  .handover summary { cursor: pointer; color: var(--accent); }
  .handover ol { margin: 8px 0 0; padding-left: 20px; }
  .handover code { font-size: 13px; }

  /* Lines */
  .rows { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
  .row { display: grid; grid-template-columns: 56px 1fr auto auto auto; grid-template-areas: "id prod k1 k2 st";
         gap: 8px 24px; align-items: center; padding: 14px 20px; }
  .row + .row { border-top: 1px solid var(--rule); }
  .row .id { grid-area: id; font-weight: 600; font-size: 18px; }
  .row .product { grid-area: prod; color: var(--ink-2); }
  .row .k1 { grid-area: k1; } .row .k2 { grid-area: k2; } .row .status { grid-area: st; justify-self: end; }
  .kv { text-align: right; }
  .kv b { display: block; font: 600 20px/1.1 var(--font-num); font-variant-numeric: tabular-nums; }
  .kv span { font-size: 13px; color: var(--ink-3); }
  .status { font-size: 14px; font-weight: 500; padding: 2px 10px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .status.OK { color: var(--ok); } .status.WARN { color: var(--warn); } .status.ALERT { color: var(--bad); }
  @media (max-width: 640px) {
    .row { grid-template-columns: 36px 1fr auto; grid-template-areas: "id prod st" ". k1 k2"; gap: 8px 16px; padding: 14px 16px; }
    .kv { text-align: left; }
    .tabs .hrs { display: none; }
    .checked { margin-left: 0; width: 100%; }
  }

  /* Alerts */
  .events { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
  .events li + li { border-top: 1px solid var(--rule); }
  .events .pick { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 112px 1fr; gap: 4px 16px; width: 100%; padding: 14px 20px; cursor: pointer; }
  .events li:has(.pick:hover), .events li:has(.pick[aria-pressed="true"]) { background: var(--accent-soft); }
  .events .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .events .when { font: 600 17px var(--font-num); font-variant-numeric: tabular-nums; }
  .events .what { font-weight: 500; }
  .events .detail { grid-column: 2; color: var(--ink-2); font-size: 14px; }
  .empty { padding: 16px 20px; color: var(--ink-2); }
  @media (max-width: 600px) { .events .pick { grid-template-columns: 1fr; padding: 14px 16px; } .events .detail { grid-column: 1; } }

  /* Chart */
  .chart-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 20px 12px; margin-top: 12px; }
  .chart-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .chart-head .t { font-weight: 600; }
  .chart-head .s { color: var(--ink-2); font-size: 14px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 8px; }
  #chart { position: relative; margin-top: 8px; }
  #chart svg { display: block; width: 100%; height: 240px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; font-size: 13px; white-space: nowrap; display: none; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }

  /* Shift table */
  .table-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; color: var(--ink-2); font-weight: 500; font-size: 14px; padding: 10px 16px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td { padding: 10px 16px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .more { display: none; }
  .show-more .more { display: table-cell; }
  .toggle { font: inherit; font-size: 14px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; margin-top: 8px; }

  footer { margin: 40px 0 48px; color: var(--ink-3); font-size: 14px; }
  .err { color: var(--bad); margin-top: 16px; white-space: pre-wrap; }

  /* ---------- Investigation agent ---------- */
  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .btn { font: inherit; font-size: 14px; font-weight: 500; border-radius: 6px; padding: 6px 14px; cursor: pointer;
         border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
         transition: transform 160ms var(--ease-out), background-color 150ms ease, border-color 150ms ease; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover { border-color: var(--ink-3); }
    .btn.primary:hover { filter: brightness(1.08); }
  }
  .events li { display: grid; grid-template-columns: 1fr auto; align-items: center; }
  .events .side { display: flex; align-items: center; gap: 10px; padding: 0 20px 0 8px; }
  .cause { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .cause b { color: var(--ink); font-weight: 500; }
  @media (max-width: 600px) {
    .events li { grid-template-columns: 1fr; }
    .events .side { padding: 0 16px 14px; justify-content: space-between; }
  }

  dialog.inv { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(560px, 100vw); max-width: 100vw;
               border: 0; border-left: 1px solid var(--rule); padding: 0; background: var(--bg); color: var(--ink);
               transform: translateX(100%); transition: transform 200ms var(--ease-out); overscroll-behavior: contain; }
  dialog.inv[data-open] { transform: translateX(0); transition: transform 320ms var(--ease-drawer); }
  dialog.inv::backdrop { background: rgba(18, 23, 25, .32); opacity: 0; transition: opacity 200ms var(--ease-out); }
  dialog.inv[data-open]::backdrop { opacity: 1; }
  @media (max-width: 600px) {
    dialog.inv { margin: auto 0 0; width: 100vw; height: 92dvh; border-left: 0; border-top: 1px solid var(--rule);
                 border-radius: 12px 12px 0 0; transform: translateY(100%); }
    dialog.inv[data-open] { transform: translateY(0); }
  }
  .inv-head { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--rule);
              padding: 16px 20px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .inv-kicker { font-size: 13px; color: var(--ink-3); }
  .inv-title { font-size: 18px; font-weight: 600; line-height: 1.3; margin: 0; }
  .inv-head .x { grid-row: 1 / span 2; grid-column: 2; align-self: start; font-size: 20px; line-height: 1; padding: 6px 10px; }
  .inv-body { padding: 16px 20px 32px; }
  .replay-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--ink-2); font-size: 14px; margin-bottom: 8px; }
  .linkish { font: inherit; font-size: 14px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }

  .steps { list-style: none; margin: 0; padding: 0; position: relative; }
  .step { position: relative; padding: 0 0 18px 28px; }
  .step::before { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 1px; background: var(--rule); }
  .step:last-child::before { display: none; }
  .step .dot { position: absolute; left: 0; top: 4px; width: 15px; height: 15px; border-radius: 50%;
               border: 2px solid var(--accent); background: var(--surface); }
  .step.done .dot { background: var(--accent); }
  .step.running .dot { animation: pulse 900ms ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: .35; } }
  .step .thought { margin: 0; }
  .step .call { display: inline-block; margin-top: 4px; font: 12.5px/1.4 var(--mono); color: var(--ink-2);
                background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; }
  .step .found { margin-top: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
  .step.running .found { display: none; }
  .step .wait { display: none; color: var(--ink-3); font-size: 14px; margin-top: 6px; }
  .step.running .wait { display: block; }
  .found table { font-size: 13.5px; }
  .found th, .found td { padding: 3px 8px 3px 0; border: 0; }
  .found th { font-size: 12.5px; color: var(--ink-3); }
  .found tr.moved td { color: var(--ink); font-weight: 600; }
  .found td { color: var(--ink-2); }
  .found .spark { display: block; width: 100%; height: 56px; margin-top: 6px; }
  .found details { margin-top: 6px; }
  .found summary { cursor: pointer; color: var(--ink-3); font-size: 13px; }
  .found pre { font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; margin: 6px 0 0; }
  .delta-up { color: var(--bad); } .delta-down { color: var(--series); }

  .reveal { animation: reveal 240ms var(--ease-out) both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(6px); } }

  .diag { margin-top: 6px; background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--accent);
          border-radius: 6px; padding: 16px 18px; }
  .diag.enter { animation: diag-in 260ms var(--ease-out) both; }
  @keyframes diag-in { from { opacity: 0; transform: scale(0.98); } }
  .diag-k { font-size: 13px; color: var(--ink-3); }
  .diag-cause { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 2px 0 6px; }
  .diag-cause strong { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .conf { font-size: 13px; border: 1px solid currentColor; border-radius: 99px; padding: 0 8px; color: var(--ok); }
  .conf.medium { color: var(--warn); } .conf.low { color: var(--bad); }
  .diag p { margin: 0 0 10px; }
  .diag h3 { font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  .diag ul, .diag ol { margin: 0; padding-left: 20px; }
  .diag li { margin: 3px 0; }
  .diag .meta { font-size: 13px; color: var(--ink-3); margin-top: 12px; }
  .review { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .review .q { width: 100%; font-size: 14px; color: var(--ink-2); }
  .review select, .review input { font: inherit; font-size: 14px; }
  .review input { flex: 1 1 180px; min-width: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; background: var(--surface); color: var(--ink); }
  .verdict { margin-top: 12px; font-size: 14px; padding: 10px 12px; border-radius: 6px; background: var(--accent-soft); }
  .verdict.wrong { background: var(--bad-soft); }

  .acc { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 20px; }
  .acc p { margin: 0 0 12px; color: var(--ink-2); max-width: 72ch; }
  .bar { display: grid; grid-template-columns: minmax(0, 220px) 1fr 92px; gap: 12px; align-items: center; margin: 8px 0; font-size: 14px; }
  .bar .track, .bar .fill { display: block; }
  .bar .track { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--ink-3); border-radius: 5px; }
  .bar.agent .fill { background: var(--accent); }
  .bar .v { font: 600 15px var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
  @media (max-width: 600px) { .bar { grid-template-columns: 1fr 64px; } .bar .track { grid-column: 1 / -1; grid-row: 2; } }

  @media (prefers-reduced-motion: reduce) {
    dialog.inv, dialog.inv[data-open] { transform: none; transition: opacity 200ms ease; opacity: 0; }
    dialog.inv[data-open] { opacity: 1; }
    .reveal, .diag.enter { animation: fade 200ms ease both; }
    .step.running .dot { animation: none; opacity: .5; }
    @keyframes fade { from { opacity: 0; } }
  }
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <span class="brand">LinePulse</span>
  <span class="meta" id="asof">Loading…</span>
  <span class="mode" id="mode"></span>
</div></div>

<main class="wrap">
  <div id="snapshot" class="snapshot" hidden></div>
  <div id="error" class="err" hidden></div>

  <div class="hero">
    <h1 id="headline">Checking the lines…</h1>
    <p id="subline"></p>
  </div>

  <section id="handover-section" hidden>
    <div class="handover">
      <div class="handover-head">
        <h2>Shift handover</h2>
        <div class="tabs" role="tablist" id="shift-tabs"></div>
        <span class="checked" id="checked"></span>
      </div>
      <div class="note" id="note"></div>
      <details id="how">
        <summary>How this note was written and checked</summary>
        <div id="how-body"></div>
      </details>
    </div>
  </section>

  <section>
    <h2>Lines</h2>
    <div class="rows" id="lines"></div>
  </section>

  <section>
    <h2>Drift alerts</h2>
    <ul class="events" id="alerts"></ul>
    <div class="chart-box">
      <div class="chart-head">
        <div><div class="t" id="chart-title">Signal</div><div class="s" id="chart-sub"></div></div>
        <div class="controls">
          <select id="sel-line" aria-label="Line"></select>
          <select id="sel-signal" aria-label="Signal">
            <option value="oven_z1_c">Oven zone 1 (°C)</option>
            <option value="oven_z2_c">Oven zone 2 (°C)</option>
            <option value="oven_z3_c">Oven zone 3 (°C)</option>
            <option value="fill_weight_g">Fill weight (g)</option>
            <option value="belt_speed_mpm">Belt speed (m/min)</option>
            <option value="proofer_rh_pct">Proofer humidity (%)</option>
          </select>
          <select id="sel-window" aria-label="Time window">
            <option value="120">Last 2 h</option><option value="240">Last 4 h</option>
            <option value="480" selected>Last 8 h</option><option value="1440">Last 24 h</option>
          </select>
        </div>
      </div>
      <div id="chart"><div class="tip" id="tip"></div></div>
      <div class="legend">
        <span><i style="background:var(--series)"></i>Per-minute average</span>
        <span><i style="background:var(--ink-3)"></i>Setpoint</span>
        <span><i style="background:var(--band);height:10px"></i>Normal range</span>
        <span><i style="background:var(--bad);height:6px;border-radius:3px"></i>Drifting</span>
      </div>
    </div>
  </section>

  <section id="acc-section" hidden>
    <h2>How often the investigation names the right cause</h2>
    <div class="acc" id="acc"></div>
  </section>

  <section>
    <h2>Shift results</h2>
    <div class="table-box" id="shift-box"><table id="shifts"></table></div>
    <button class="toggle" id="toggle-more" aria-expanded="false">Show reject and weight detail</button>
  </section>

  <footer id="dq"></footer>
</main>

<dialog class="inv" id="inv" aria-labelledby="inv-title">
  <div class="inv-head">
    <span class="inv-kicker" id="inv-kicker">Investigation</span>
    <h2 class="inv-title" id="inv-title"></h2>
    <button class="btn x" id="inv-close" aria-label="Close investigation">×</button>
  </div>
  <div class="inv-body">
    <div class="replay-bar"><span id="replay-status"></span><button class="linkish" id="replay-skip">Show all steps</button></div>
    <ol class="steps" id="steps"></ol>
    <div id="diag-host"></div>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "–").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v, d = 1) => v == null ? "–" : Number(v).toLocaleString("en-CA", {minimumFractionDigits: d, maximumFractionDigits: d});
const int = v => v == null ? "–" : Number(v).toLocaleString("en-CA");
const hm = iso => iso ? new Date(iso).toISOString().slice(11, 16) : "–";
const SIGNAL = {oven_z1_c: ["Oven zone 1", "°C"], oven_z2_c: ["Oven zone 2", "°C"], oven_z3_c: ["Oven zone 3", "°C"], fill_weight_g: ["Fill weight", "g"], belt_speed_mpm: ["Belt speed", "m/min"], proofer_rh_pct: ["Proofer humidity", "%"]};
const SHIFT_HOURS = {A: "06–14", B: "14–22", C: "22–06"};
const STATUS_TEXT = {OK: "Running", WARN: "High scrap", ALERT: "Drifting"};

// Static snapshot mode (GitHub Pages): scripts/build_static_demo.py sets window.LINEPULSE_STATIC
// and writes the same JSON the API returns under data/. Each API path maps to one file.
const STATIC = window.LINEPULSE_STATIC || null;
function staticPath(path) {
  const [p, q] = path.split("?");
  const sig = p.match(/^\/api\/signals\/([^/]+)\/([^/]+)$/);
  if (sig) return {url: `data/signals/${sig[1]}/${sig[2]}.json`, last: Number(new URLSearchParams(q).get("minutes") || 180)};
  const inv = p.match(/^\/api\/investigations\/([^/]+)$/);
  if (inv && inv[1] !== "evaluation") return {url: `data/investigations/${inv[1]}.json`};
  const files = {"/health": "health", "/api/lines": "lines", "/api/alerts": "alerts", "/api/shifts": "shifts",
                 "/api/data-quality": "data-quality", "/api/handover": "handover",
                 "/api/investigations": "investigations", "/api/investigations/evaluation": "investigation-eval"};
  return {url: `data/${files[p]}.json`};
}

async function get(path) {
  const target = STATIC ? staticPath(path) : {url: path};
  const r = await fetch(target.url);
  if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(`${path}: ${r.status} ${b.title || ""}`); }
  const data = await r.json();
  return target.last ? data.slice(-target.last) : data;
}

// ---------- handover
let notes = [];
let lastAlerts = null;
function noteHtml(note, unverified) {
  const bad = new Set(unverified || []);
  const token = /L\d+-\d{8}-\d{3}|\b\d{4}-\d{2}-\d{2}\b|\b\d{1,2}:\d{2}\b|(?<![\w.])[-+]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?/g;
  const label = /(zone|zones|Shift|shift|and|,)\s*$/;
  const mark = text => esc(text).replace(token, (m, off, s) => {
    if (/^\d$/.test(m) && label.test(s.slice(Math.max(0, off - 7), off))) return m; // "zone 3", "Shift A" labels
    return `<span class="fig${bad.has(m) || bad.has(m.replace(/^\+/, "")) ? " bad" : ""}">${m}</span>`;
  });
  const inline = t => mark(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  let html = "", list = false;
  for (const raw of note.split("\n")) {
    const line = raw.trim();
    if (/^[-*] /.test(line)) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(line.slice(2))}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (line) html += `<p>${inline(line)}</p>`;
  }
  return html + (list ? "</ul>" : "");
}

function showNote(i) {
  const n = notes[i];
  document.querySelectorAll("#shift-tabs button").forEach((b, k) => b.setAttribute("aria-selected", String(k === i)));
  $("#note").innerHTML = noteHtml(n.note, n.unverified);
  const ok = n.figures_verified === n.figures_total;
  $("#checked").className = "checked" + (ok ? "" : " bad");
  $("#checked").textContent = ok ? `All ${n.figures_total} figures checked against the data`
                                 : `${n.figures_total - n.figures_verified} of ${n.figures_total} figures not found in the data`;
  const who = n.writer === "llm" ? `Written by ${esc(n.model)} through ${n.tool_calls.length} tool calls over the gold tables`
                                 : "Written by the fallback template (no LLM key configured), from the same tool calls";
  $("#how-body").innerHTML = `<p>${who}${n.retried ? ", rewritten once after the checker found unsupported figures" : ""}.
    Every number, time and lot ID in the note is matched against what the tools returned: figures with a dotted underline were found,
    figures highlighted in red were not.</p><ol>${n.tool_calls.map(c =>
      `<li><code>${esc(c.tool)}(${esc(Object.entries(c.args || {}).map(([k, v]) => `${k}=${v}`).join(", "))})</code></li>`).join("")}</ol>`;
}

function renderHandover(list) {
  const order = {A: 0, B: 1, C: 2};
  notes = [...list].sort((a, b) => a.shift_date.localeCompare(b.shift_date) || order[a.shift] - order[b.shift]);

  document.querySelectorAll("#shift-tabs button").forEach(b => b.onclick = () => showNote(Number(b.dataset.i)));
  const withAlerts = notes.findIndex(n => !/No drift alerts|Nothing drifted/i.test(n.note));
  showNote(withAlerts >= 0 ? withAlerts : 0);
}

// ---------- chart
async function drawChart() {
  const line = $("#sel-line").value, signal = $("#sel-signal").value, win = $("#sel-window").value;
  const [name, unit] = SIGNAL[signal];
  $("#chart-title").textContent = `${line} ${name.toLowerCase()}`;
  const rows = await get(`/api/signals/${line}/${signal}?minutes=${win}`);
  const host = $("#chart"), tip = $("#tip");
  host.querySelector("svg")?.remove();
  if (!rows.length) { $("#chart-sub").textContent = "No data yet."; return; }
  const sp = rows[0].setpoint, thr = rows[0].threshold;
  const overN = rows.filter(r => r.over).length;
  $("#chart-sub").textContent = `Setpoint ${fmt(sp, 1)} ${unit}. An alert fires after 3 minutes more than ${fmt(thr, 1)} ${unit} off (smoothed). ` +
    (overN ? `${overN} minutes drifting in this window.` : "No drift in this window.");

  const W = host.clientWidth || 800, H = 240, m = {l: 44, r: 8, t: 10, b: 26};
  const t = rows.map(r => Date.parse(r.minute)), v = rows.map(r => r.mean_value);
  const rawLo = Math.min(...v, sp - thr), rawHi = Math.max(...v, sp + thr);
  const span = rawHi - rawLo || 1, mag = 10 ** Math.floor(Math.log10(span / 4));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(st => span / st <= 5);
  const lo = Math.floor(rawLo / step) * step, hi = Math.ceil(rawHi / step) * step;
  const X = x => m.l + (x - t[0]) / Math.max(1, t.at(-1) - t[0]) * (W - m.l - m.r);
  const Y = y => m.t + (1 - (y - lo) / (hi - lo)) * (H - m.t - m.b);
  const yt = []; for (let y = lo; y <= hi + step / 2; y += step) yt.push(y);
  const hours = (t.at(-1) - t[0]) / 36e5, every = (hours > 12 ? 4 : hours > 4 ? 2 : hours > 2 ? 1 : 0.5) * 36e5 * (W < 500 ? 2 : 1);
  const xt = []; for (let x = Math.ceil(t[0] / every) * every; x <= t.at(-1); x += every) xt.push(x);
  const path = rows.map((r, i) => `${i ? "L" : "M"}${X(t[i]).toFixed(1)},${Y(r.mean_value).toFixed(1)}`).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(line)} ${esc(name)} per-minute average over time">
    ${yt.map(y => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--grid)"/>
      <text x="${m.l - 8}" y="${Y(y) + 4}" text-anchor="end" font-size="12" fill="var(--ink-3)">${fmt(y, step < 1 ? 1 : 0)}</text>`).join("")}
    ${xt.map(x => `<text x="${X(x)}" y="${H - 6}" text-anchor="middle" font-size="12" fill="var(--ink-3)">${hm(new Date(x).toISOString())}</text>`).join("")}
    <rect x="${m.l}" width="${W - m.l - m.r}" y="${Y(sp + thr)}" height="${Y(sp - thr) - Y(sp + thr)}" fill="var(--band)"/>
    <line x1="${m.l}" x2="${W - m.r}" y1="${Y(sp)}" y2="${Y(sp)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>
    <path d="${path}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round"/>
    ${rows.map((r, i) => r.over ? `<circle cx="${X(t[i])}" cy="${Y(r.mean_value)}" r="3" fill="var(--bad)" stroke="var(--surface)" stroke-width="1"/>` : "").join("")}
    <line id="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-3)" visibility="hidden"/>
    <rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/>
  </svg>`;
  host.insertAdjacentHTML("afterbegin", svg);
  const s = host.querySelector("svg"), xh = s.querySelector("#xh");
  s.querySelector("#hit").onmousemove = e => {
    const box = s.getBoundingClientRect(), px = (e.clientX - box.left) * (W / box.width);
    let i = 0, best = Infinity;
    t.forEach((x, k) => { const d = Math.abs(X(x) - px); if (d < best) { best = d; i = k; } });
    const r = rows[i];
    xh.setAttribute("x1", X(t[i])); xh.setAttribute("x2", X(t[i])); xh.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.innerHTML = `<b>${hm(r.minute)} UTC</b><br>${fmt(r.mean_value, 2)} ${unit}${r.over ? ", drifting" : ""}`;
    const left = Math.min((X(t[i]) / W) * box.width + 12, box.width - tip.offsetWidth - 4);
    tip.style.left = left + "px"; tip.style.top = "8px";
  };
  s.querySelector("#hit").onmouseleave = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); };
}

// ---------- investigation agent: replay a recorded run, then accept or override
const TOOL_LABEL = {get_alert: "Read the alert", get_signal_window: "Look at the signal around it",
  compare_line_signals: "Compare every signal on the line", get_product_quality: "Check what came off the line",
  get_related_alerts: "Look for related alerts"};
const seen = new Set();   // replays already watched this visit open fully, without the animation
let replayTimer = null, lastOpener = null, current = null;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

function argText(t, a) {
  if (t === "get_alert" || t === "get_related_alerts") return a.alert_id || "";
  const w = a.start && a.end ? ` ${hm(a.start)}–${hm(a.end)}` : "";
  return [a.line_id, a.signal].filter(Boolean).join(" ") + w;
}
const signed = (v, d) => {
  if (v == null) return "–";
  const r = Number(Number(v).toFixed(d)) || 0;   // no "-0.0"
  return (r > 0 ? "+" : "") + fmt(r, d);
};
const dp = u => u === "°C" || u === "%" ? 1 : 2;

function sparkline(samples, unit) {
  if (!samples?.length) return "";
  const W = 480, H = 56, v = samples.map(s => s.deviation ?? 0), lo = Math.min(0, ...v), hi = Math.max(0, ...v), span = hi - lo || 1;
  const X = i => 4 + i / Math.max(1, v.length - 1) * (W - 8), Y = y => 4 + (1 - (y - lo) / span) * (H - 16);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Deviation from setpoint every 5 minutes">
    <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink-3)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
    <path d="${v.map((y, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join("")}" fill="none" stroke="var(--series)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <text x="4" y="${H - 2}" font-size="11" fill="var(--ink-3)">${esc(samples[0].time)}</text>
    <text x="${W - 4}" y="${H - 2}" font-size="11" text-anchor="end" fill="var(--ink-3)">${esc(samples.at(-1).time)}</text></svg>`;
}

function foundHtml(step) {
  const r = step.result || {};
  if (r.error) return `<span style="color:var(--bad)">${esc(r.error)}</span>`;
  let body = "";
  if (step.tool === "get_alert") {
    body = `${esc(r.line_id)} ${esc((r.signal_name || "").toLowerCase())} ran ${esc(r.direction)} from ${esc(r.started)} to ${esc(r.ended)},
      up to ${fmt(r.peak_smoothed_deviation, dp(r.unit))} ${esc(r.unit)} off setpoint (smoothed). ${int(r.packs_in_window)} packs and lots
      ${esc((r.lot_numbers || []).join(", "))} were made during it.`;
  } else if (step.tool === "get_signal_window") {
    body = `${r.onset === "sudden" ? "Sudden" : "Gradual"} change: ${signed(r.mean_deviation_before, dp(r.unit))} ${esc(r.unit)} in the baseline hour,
      ${signed(r.mean_deviation_during, dp(r.unit))} during the alert, peak ${signed(r.peak_deviation, dp(r.unit))} at ${esc(r.peak_at)}.
      Reading noise <b>${fmt(r.noise_ratio, 1)}×</b> the baseline.${sparkline(r.samples, r.unit)}`;
  } else if (step.tool === "compare_line_signals") {
    body = `<table><tr><th>Signal</th><th class="num">Before</th><th class="num">During</th><th class="num">Change</th></tr>` +
      (r.signals || []).map(x => {
        const moved = Math.abs(x.change || 0) >= 0.5 * (x.alarm_threshold || Infinity);
        return `<tr class="${moved ? "moved" : ""}"><td>${esc(x.signal_name)}</td><td class="num">${signed(x.mean_deviation_before, dp(x.unit))}</td>
          <td class="num">${signed(x.mean_deviation_during, dp(x.unit))}</td><td class="num">${signed(x.change, dp(x.unit))} ${esc(x.unit)}</td></tr>`;
      }).join("") + `</table><div style="color:var(--ink-3);font-size:13px">Deviation from setpoint; baseline ${esc(r.baseline)}. Bold: moved by half its alarm limit or more.</div>`;
  } else if (step.tool === "get_product_quality") {
    const b = r.before || {}, d = r.during || {};
    const row = (k, label, dd) => `<tr><td>${label}</td><td class="num">${fmt(b[k], dd)}</td><td class="num">${fmt(d[k], dd)}</td></tr>`;
    body = `<table><tr><th></th><th class="num">Baseline</th><th class="num">During</th></tr>
      ${row("packs_per_min", "Packs per minute", 1)}${row("bake_defects_per_1000", "Bake defects per 1,000", 1)}
      ${row("underweight_per_1000", "Underweight per 1,000", 1)}${row("mean_pack_weight_g", "Mean pack weight (g)", 2)}</table>`;
  } else if (step.tool === "get_related_alerts") {
    const list = (title, xs) => xs?.length ? `<div>${title}: ${xs.map(x => `${esc(x.line_id)} ${esc(x.signal_name.toLowerCase())} ${esc(x.direction)} from ${esc(x.started)}`).join("; ")}</div>` : "";
    body = list("Same line", r.same_line_nearby) + list("Other line, same time", r.other_lines_same_time) +
      list("Earlier on this signal", r.earlier_same_signal) || "No related alerts.";
  }
  return body + `<details><summary>Raw tool result</summary><pre>${esc(JSON.stringify(r, null, 1))}</pre></details>`;
}

function stepHtml(step, i) {
  return `<li class="step" data-step="${i}"><span class="dot" aria-hidden="true"></span>
    <p class="thought">${esc(step.thought || TOOL_LABEL[step.tool] || step.tool)}</p>
    <code class="call">${esc(step.tool)}(${esc(argText(step.tool, step.args || {}))})</code>
    <div class="wait">Checking…</div><div class="found">${foundHtml(step)}</div></li>`;
}

// Figures in the diagnosis get the same dotted underline as the handover note when they checked out.
const figMark = (text, bad) => noteHtml(text, bad).replace(/^<p>|<\/p>$/g, "");

function reviewKey(id) { return `linepulse.review.${id}`; }
function reviewFor(id, serverReview) {
  if (!STATIC) return serverReview || null;
  try { return JSON.parse(localStorage.getItem(reviewKey(id)) || "null"); } catch { return null; }
}
async function saveReview(id, body, diagnosed) {
  if (STATIC) {
    const r = {...body, root_cause: body.decision === "accept" ? diagnosed : body.root_cause, at: new Date().toISOString()};
    try { localStorage.setItem(reviewKey(id), JSON.stringify(r)); } catch { /* private mode: keep it for this view only */ }
    return r;
  }
  const res = await fetch(`/api/investigations/${encodeURIComponent(id)}/review`,
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!res.ok) throw new Error(`Review not saved: ${(await res.json().catch(() => ({}))).error || res.status}`);
  return res.json();
}

function diagHtml(rec, review) {
  const d = rec.diagnosis, bad = rec.unverified || [];
  const by = rec.writer === "llm" ? `Investigated by ${esc(rec.model)}` : "Investigated by the deterministic investigator (no LLM key configured)";
  const checked = rec.figures_verified === rec.figures_total ? `all ${rec.figures_total} figures checked against the tool results`
    : `${rec.figures_total - rec.figures_verified} of ${rec.figures_total} figures not found in the tool results`;
  let rv;
  if (!review) {
    rv = `<div class="review" id="review"><span class="q">Do you agree? Your answer is kept with the investigation${STATIC ? " (in this browser)" : ""}.</span>
      <button class="btn primary" id="rv-accept">Accept</button><button class="btn" id="rv-override">Override…</button></div>`;
  } else {
    const gt = rec.ground_truth;
    const right = gt && gt.cause === review.root_cause, agent = gt && gt.cause === d.root_cause;
    rv = `<div class="review"><span class="q">${review.decision === "accept" ? "You accepted this diagnosis." :
        `You overrode it: <b>${esc(CAUSE[review.root_cause] || review.root_cause)}</b>${review.note ? ` (“${esc(review.note)}”)` : ""}.`}</span>
        <button class="linkish" id="rv-undo">Change answer</button></div>` +
      (gt ? `<div class="verdict ${right ? "" : "wrong"}">Simulator ground truth: <b>${esc(CAUSE[gt.cause] || gt.cause)}</b> (fault ${esc(gt.fault_id)}).
        The agent was ${agent ? "right" : "wrong"}${review.decision === "override" ? `, and your override was ${right ? "right" : "wrong"}` : ""}.</div>` : "");
  }
  return `<div class="diag-k">Diagnosis</div>
    <div class="diag-cause"><strong>${esc(CAUSE[d.root_cause] || d.root_cause)}</strong><span class="conf ${esc(d.confidence)}">${esc(d.confidence)} confidence</span></div>
    <p>${figMark(d.summary, bad)}</p>
    <h3>Evidence</h3><ul>${(d.evidence || []).map(e => `<li>${figMark(e, bad)}</li>`).join("")}</ul>
    ${d.ruled_out?.length ? `<h3>Ruled out</h3><ul>${d.ruled_out.map(r => `<li><b>${esc(CAUSE[r.cause] || r.cause)}</b>: ${figMark(r.why, bad)}</li>`).join("")}</ul>` : ""}
    <h3>Recommended actions</h3><ol>${(d.actions || []).map(a => `<li>${figMark(a, bad)}</li>`).join("")}</ol>
    <div class="meta">${by} through ${rec.steps.length} tool calls; ${checked}${rec.retried ? ", corrected once after the check" : ""}.</div>${rv}`;
}

function renderDiag(rec, animate) {
  const host = $("#diag-host");
  host.innerHTML = `<div class="diag${animate ? " enter" : ""}">${diagHtml(rec, reviewFor(rec.alert_id, rec.review))}</div>`;
  const id = rec.alert_id, diagnosed = rec.diagnosis.root_cause;
  const done = async body => {
    const r = await saveReview(id, body, diagnosed);
    rec.review = r;
    const row = investigations.get(id); if (row) row.review = r;
    renderDiag(rec, false);
    if (lastAlerts) renderAlerts(lastAlerts);
  };
  $("#rv-accept")?.addEventListener("click", () => done({decision: "accept"}).catch(showError));
  $("#rv-override")?.addEventListener("click", () => {
    $("#review").innerHTML = `<span class="q">What was the cause?</span>
      <select id="rv-cause" aria-label="Root cause">${Object.entries(CAUSE).filter(([k]) => k !== diagnosed)
        .map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      <input id="rv-note" maxlength="500" placeholder="What you found (optional)" aria-label="Note">
      <button class="btn primary" id="rv-save">Save</button>`;
    $("#rv-cause").focus();
    $("#rv-save").onclick = () => done({decision: "override", root_cause: $("#rv-cause").value, note: $("#rv-note").value || null}).catch(showError);
  });
  $("#rv-undo")?.addEventListener("click", () => {
    if (STATIC) { try { localStorage.removeItem(reviewKey(id)); } catch {} }
    rec.review = null; renderDiag(rec, false);
    if (!STATIC) $("#rv-accept")?.focus();
  });
}

function finishReplay(rec, animate) {
  clearTimeout(replayTimer);
  document.querySelectorAll("#steps .step").forEach(li => { li.classList.remove("running"); li.classList.add("done"); li.hidden = false; });
  $("#replay-skip").hidden = true;
  $("#replay-status").textContent = `${rec.steps.length} checks, then a diagnosis.` + (rec.writer === "llm" ? "" : " Recorded run, replayed.");
  renderDiag(rec, animate);
  seen.add(rec.alert_id);
}

function replay(rec) {
  const items = [...document.querySelectorAll("#steps .step")];
  items.forEach(li => li.hidden = true);
  $("#replay-skip").hidden = false;
  let i = 0;
  const next = () => {
    if (i > 0) { items[i - 1].classList.remove("running"); items[i - 1].classList.add("done"); }
    if (i === items.length) { finishReplay(rec, true); return; }
    const li = items[i];
    li.hidden = false; li.classList.add("reveal", "running");
    $("#replay-status").textContent = `Step ${i + 1} of ${items.length}: ${TOOL_LABEL[rec.steps[i].tool] || rec.steps[i].tool}…`;
    li.scrollIntoView({block: "nearest", behavior: reduceMotion.matches ? "auto" : "smooth"});
    i += 1;
    replayTimer = setTimeout(next, 850);
  };
  next();
}

async function openInvestigation(id, opener) {
  lastOpener = opener;
  const rec = await get(`/api/investigations/${encodeURIComponent(id)}`);
  current = rec;
  const [name] = SIGNAL[rec.signal] || [rec.signal];
  $("#inv-kicker").textContent = `Investigation · alert at ${hm(rec.start_minute)} UTC`;
  $("#inv-title").textContent = `Why did ${rec.line_id} ${name.toLowerCase()} alarm?`;
  $("#steps").innerHTML = rec.steps.map(stepHtml).join("");
  $("#diag-host").innerHTML = "";
  const dlg = $("#inv");
  if (!dlg.open) { dlg.showModal(); requestAnimationFrame(() => dlg.setAttribute("data-open", "")); }
  dlg.querySelector(".inv-body").scrollTop = 0; dlg.scrollTop = 0;
  if (seen.has(id)) finishReplay(rec, false); else replay(rec);
}

function closeInvestigation() {
  const dlg = $("#inv");
  clearTimeout(replayTimer);
  dlg.removeAttribute("data-open");
  const done = () => { dlg.close(); lastOpener?.focus(); };
  if (reduceMotion.matches) { done(); return; }
  dlg.addEventListener("transitionend", done, {once: true});
  setTimeout(() => dlg.open && done(), 260);   // in case transitionend never fires
}
$("#inv-close").onclick = closeInvestigation;
$("#inv").addEventListener("cancel", e => { e.preventDefault(); closeInvestigation(); });
$("#inv").addEventListener("click", e => { if (e.target === $("#inv")) closeInvestigation(); });   // backdrop
$("#replay-skip").onclick = () => current && finishReplay(current, false);

function renderAccuracy(ev) {
  if (!ev?.methods) { $("#acc-section").hidden = true; return; }
  const m = ev.methods, rows = [
    ["lookup", "Alarm lookup table: one cause per signal", false],
    ["rules", "Deterministic investigator", !m.llm],
    ["llm", `LLM investigation agent (${ev.llm_model || "LLM"})`, true],
  ].filter(([k]) => m[k]?.n);
  $("#acc-section").hidden = false;
  const tc = m.lookup.by_cause.thermocouple_drift;
  $("#acc").innerHTML = `<p>Scored on ${int(ev.days)} random simulated days with ${int(ev.incidents)} injected incidents, each with a known root cause.
    Reading the alarm alone works when the alarm's signal is the cause; it got all ${int(tc.n)} drifting thermocouples wrong, the case where
    adjusting the burner would make things worse.</p>` +
    rows.map(([k, label, agent]) => `<div class="bar${agent ? " agent" : ""}"><span>${esc(label)}</span>
      <span class="track"><span class="fill" style="width:${(100 * m[k].rate).toFixed(1)}%"></span></span>
      <span class="v">${int(m[k].correct)} / ${int(m[k].n)}</span></div>`).join("") +
    (m.llm ? "" : `<p class="note-s">The LLM agent's score appears here once it has been evaluated with an API key (see the README).</p>`);
}

function showError(e) { $("#error").hidden = false; $("#error").textContent = e.message; }

async function load() {
  try {
    const optional = path => get(path).catch(() => null);   // investigations may not have been generated yet
    const [health, lines, alerts, shifts, dq, handover, invs, evaluation] = await Promise.all([
      ...["/health", "/api/lines", "/api/alerts?limit=50", "/api/shifts", "/api/data-quality", "/api/handover"].map(get),
      optional("/api/investigations"), optional("/api/investigations/evaluation")]);
    $("#error").hidden = true;
    investigations = new Map((invs || []).map(r => [r.alert_id, r]));
    lastAlerts = alerts;
    renderAccuracy(evaluation);
    $("#mode").textContent = {databricks: "Live from Databricks SQL", snapshot: "Snapshot"}[health.mode] || "Local data";
    const keepLine = $("#sel-line").value;
    renderHero(lines, alerts); renderLines(lines); renderAlerts(alerts); renderShifts(shifts); renderDq(dq);
    if (!notes.length) renderHandover(handover);
    if (keepLine) $("#sel-line").value = keepLine;
    else if (alerts[0]) { $("#sel-line").value = alerts[0].line_id; $("#sel-signal").value = alerts[0].signal; }
    await drawChart();
  } catch (e) { showError(e); }
}
["#sel-line", "#sel-signal", "#sel-window"].forEach(s => $(s).onchange = () => drawChart().catch(showError));
window.addEventListener("resize", () => drawChart().catch(() => {}));

if (STATIC) {
  const sc = STATIC.scorecard;
  $("#snapshot").hidden = false;
  $("#snapshot").innerHTML = `This is a snapshot of a ${STATIC.hours}-hour simulated run${STATIC.matches_live ? ", identical to the run on Databricks" : ""}. ` +
    `${sc.detected} of ${sc.faults} injected faults were caught, on average ${sc.mean_latency_min} minutes after they started, with ${sc.false_alarms} false alarms. ` +
    `Press <b>Investigate</b> on an alert to replay how the agent worked out its cause. <a href="${STATIC.repo}">How it works</a>`;
  $("#sel-window").value = "1440";
  load();
} else {
  load();
  setInterval(load, 30000);
}
</script>
</body>
</html>
