name: ci
on:
  push:
  pull_request:

jobs:
  pipeline-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Unit + end-to-end tests (Delta Lake)
        env: { LINEPULSE_ENGINE: delta }
        run: pytest -q

      - name: Simulate one shift and build gold tables
        run: python scripts/run_local.py --minutes 480 --chunks 4 --engine delta

      - name: Write shift-handover notes (template, no API key in CI)
        run: python scripts/generate_handover.py --no-llm

      - name: Build API
        run: dotnet build api/LinePulse.Api -c Release

      - name: Smoke-test API (local mode)
        run: |
          dotnet run --project api/LinePulse.Api -c Release --no-build --urls http://127.0.0.1:5080 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5080/health && break; sleep 1; done
          bash scripts/smoke_api.sh http://127.0.0.1:5080

      - name: Smoke-test API (Databricks mode, against a fake SQL endpoint)
        run: |
          python tests/fake_databricks.py --export local_data/export --port 8799 &
          DATABRICKS_HOST=http://127.0.0.1:8799 DATABRICKS_TOKEN=fake DATABRICKS_WAREHOUSE_ID=wh \
            LinePulse__Mode=Databricks \
            dotnet run --project api/LinePulse.Api -c Release --no-build --urls http://127.0.0.1:5090 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5090/health && break; sleep 1; done
          bash scripts/smoke_api.sh http://127.0.0.1:5090

      - name: Upload scorecard
        uses: actions/upload-artifact@v4
        with: { name: scorecard, path: local_data/export/scorecard.json }
