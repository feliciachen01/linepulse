name: pages
# Rebuilds the static dashboard demo from source on every push to main:
# simulate 24 h -> run the pipeline (Delta) -> export gold -> investigate alerts -> handover
# notes -> static site -> GitHub Pages. The only secret is the optional GEMINI_API_KEY; the page
# is generated, not connected to Databricks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling: several merges in a row used to cancel every run before
# any finished, so the site never updated. The newest queued run always deploys last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Simulate 24 h and build gold tables (same run as the live Databricks run)
        run: python scripts/run_local.py --minutes 1440 --chunks 6 --engine delta

      - name: Investigate every alert (LLM agent if GEMINI_API_KEY is set, else deterministic investigator)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/investigate_alerts.py --llm-budget-s 480
        timeout-minutes: 15

      - name: Write shift-handover notes (LLM agent if GEMINI_API_KEY is set, else template)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/generate_handover.py
        timeout-minutes: 10

      - name: Build static site
        run: python scripts/build_static_demo.py --out site

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
