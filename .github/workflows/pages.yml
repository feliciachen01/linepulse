name: pages
# Rebuilds the static dashboard demo from source on every push to main:
# simulate 24 h -> run the pipeline (Delta) -> export gold -> static site -> GitHub Pages.
# No secrets involved: the page is generated, not connected to Databricks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Simulate 24 h and build gold tables (same run as the live Databricks run)
        run: python scripts/run_local.py --minutes 1440 --chunks 6 --engine delta

      - name: Build static site
        run: python scripts/build_static_demo.py --out site

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
